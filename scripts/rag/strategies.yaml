# Segmentation strategies indexed by the retrieval stage (plan §3.1,
# docs/20260927_204356_rag_pipeline_implementation_plan.md; strategy doc §5).
#
# A strategy is the set of chunk `Tipo`s it indexes. Adding a strategy = adding an entry here.
# `expected_rows` is checked at load time with a warning (not an error): it guards against running
# on a chunk file other than the one the numbers were measured on.
#
# expected_rows measured on segmented/chunks_all.csv.gz, SHA-256 f3db0904…55f9b (2026-09-27).
# (The plan quotes 26,252 / 82,644 / 87,947 from the 2026-09-24 run; the current file drops the
# over-limit grouping chunks listed in segmented/groupings_over_limit.csv.)

strategies:
  S1:
    tipos: [ART, DSP, TXT, TAB]
    description: "Article (or top-level dispositivo) + non-statutory units"
    expected_rows: 26250
  S2:
    tipos: [ART, DSP, TXT, TAB, CPT, PAR, INC, ALI, ITE]
    description: "S1 + sub-article units with ancestor path"
    expected_rows: 82642
  S3:
    tipos: [ART, DSP, TXT, TAB, CPT, PAR, INC, ALI, ITE, PRT, LIV, TIT, SBT, CAP, SEC, SSC]
    description: "S2 + grouping chunks"
    expected_rows: 87702

# Grouping unit types: matched to articles by interval containment (plan §4.2 G2).
grouping_tipos: [PRT, LIV, TIT, SBT, CAP, SEC, SSC]

# Coarse-to-fine order, used to pick the chunk that represents a text shared by several chunks
# (plan §3.3).
unit_precedence: [PRT, LIV, TIT, SBT, CAP, SEC, SSC, ART, DSP, TXT, TAB, CPT, PAR, INC, ALI, ITE]
