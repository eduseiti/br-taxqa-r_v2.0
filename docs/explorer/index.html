<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BR-TaxQA-R Explorer</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #77756f;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --crit: #d03b3b;
  --lab-S: #1c7a3e; --lab-P: #c9a227; --lab-N: #d9d7cf; --lab-C: #d03b3b; --lab-X: #f3f2ee;
  --heat: 28, 122, 62;
  --code: #f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #95938c;
    --grid: #2c2c2a; --axis: #4a4a46; --ring: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-ink: #0ca30c;
    --lab-S: #2f9d55; --lab-P: #c9a227; --lab-N: #3a3a37; --lab-C: #e05252; --lab-X: #232321;
    --heat: 47, 157, 85;
    --code: #262624;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #95938c;
  --grid: #2c2c2a; --axis: #4a4a46; --ring: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-ink: #0ca30c;
  --lab-S: #2f9d55; --lab-P: #c9a227; --lab-N: #3a3a37; --lab-C: #e05252; --lab-X: #232321;
  --heat: 47, 157, 85;
  --code: #262624;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
header.top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--grid); }
.top-inner { max-width: 1280px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.top-inner h1 { font-size: 16px; margin: 0; font-weight: 650; white-space: nowrap; }
nav.main { display: flex; gap: 2px; }
nav.main a { text-decoration: none; color: var(--ink-2); padding: 4px 10px; border-radius: 6px; }
nav.main a.on { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.trail { flex: 1 1 300px; display: flex; gap: 4px; align-items: center; overflow-x: auto; font-size: 12px; color: var(--muted); white-space: nowrap; scrollbar-width: thin; }
.trail a { color: var(--ink-2); text-decoration: none; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--ring); }
.trail a:hover { background: var(--surface-2); }
.trail a.cur { color: var(--ink); font-weight: 600; }
main { max-width: 1280px; margin: 0 auto; padding: 14px 16px 60px; }
h2 { font-size: 19px; margin: 2px 0 4px; font-weight: 650; overflow-wrap: anywhere; }
h4 { font-size: 13.5px; margin: 12px 0 4px; font-weight: 650; }
p { margin: 6px 0; max-width: 92ch; }
.small { font-size: 12px; color: var(--ink-2); }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
.what { border-left: 3px solid var(--accent); background: var(--accent-wash); padding: 6px 12px; border-radius: 0 8px 8px 0; margin: 6px 0; font-size: 12.5px; max-width: 110ch; }
.warnbox { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 8px 0; font-size: 13px; overflow-wrap: anywhere; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; margin: 6px 0 8px; }
.ctl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); min-width: 0; max-width: 100%; }
.opts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
select, input[type=text], input[type=search] { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); max-width: 100%; }
.chip { border: 1px solid var(--axis); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
button.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button.btn:hover:not(:disabled) { background: var(--surface-2); }
button.btn:disabled { opacity: .45; cursor: default; }
.lnk { color: var(--accent); cursor: pointer; text-decoration: none; border-bottom: 1px dotted var(--accent); background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; font: inherit; text-align: left; }
table.t { border-collapse: collapse; font-size: 12.5px; width: 100%; }
table.t th, table.t td { padding: 4px 8px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
table.t th { color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); z-index: 1; }
table.t th.sort { cursor: pointer; } table.t th.sort:hover { color: var(--ink); }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t td.c, table.t th.c { text-align: center; }
table.t tr.clk { cursor: pointer; }
table.t tr.clk:hover td { background: var(--surface-2); }
table.t tr.sel td { background: var(--accent-wash); }
table.t tr.sep td { background: var(--surface-2); color: var(--muted); font-style: italic; text-align: center; }
.tablewrap { overflow: auto; max-height: 560px; border: 1px solid var(--ring); border-radius: 8px; }
.tablewrap.free { max-height: none; }
.pill { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--ring); white-space: nowrap; }
.pill.explicit { background: color-mix(in srgb, var(--s1) 16%, transparent); }
.pill.embedded { background: color-mix(in srgb, var(--s7) 18%, transparent); }
.pill.warn { background: color-mix(in srgb, var(--warn) 25%, transparent); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 650; border-radius: 4px; padding: 0 5px; color: #fff; }
.tag.A { background: var(--lab-S); } .tag.D { background: var(--s7); } .tag.P { background: var(--lab-P); color: #0b0b0b; }
.tag.in { background: var(--s1); } .tag.inside { background: transparent; color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); }
.sbit { font-size: 10px; border-radius: 3px; padding: 0 4px; border: 1px solid var(--axis); color: var(--muted); }
.sbit.on { color: #fff; border-color: transparent; }
.scount { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.scount span { font-size: 10.5px; border-radius: 3px; padding: 0 4px; font-variant-numeric: tabular-nums; border: 1px solid var(--ring); color: var(--ink-2); }
.scount span.zero { opacity: .45; }
.imp-badge { display: inline-block; font-size: 10.5px; font-weight: 650; border-radius: 4px; padding: 0 6px; cursor: help; }
.imp-badge.vital { background: var(--ink); color: var(--surface); }
.imp-badge.okay { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--axis); }
.labcell { display: inline-block; min-width: 22px; text-align: center; border-radius: 4px; font-weight: 650; font-size: 11px; padding: 1px 4px; }
.labcell.S { background: var(--lab-S); color: #fff; } .labcell.P { background: var(--lab-P); color: #0b0b0b; }
.labcell.N { background: var(--lab-N); color: var(--ink-2); } .labcell.C { background: var(--lab-C); color: #fff; }
.labcell.X { background: var(--lab-X); color: var(--muted); }
.ng { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.ng td.lab { width: 24px; height: 20px; text-align: center; border-radius: 4px; font-weight: 650; font-size: 10.5px; cursor: help; }
.ng td.lab.S { background: var(--lab-S); color: #fff; } .ng td.lab.P { background: var(--lab-P); color: #0b0b0b; }
.ng td.lab.N { background: var(--lab-N); color: var(--ink-2); } .ng td.lab.C { background: var(--lab-C); color: #fff; }
.ng td.lab.X { background: var(--lab-X); color: var(--muted); }
.ng th { font-weight: 500; font-size: 11px; color: var(--ink-2); padding: 0 4px; white-space: nowrap; text-align: left; }
.ng th.v { text-align: center; }
.badge-ok { color: var(--good-ink); font-weight: 650; } .badge-warn { color: var(--crit); font-weight: 650; }
.answer { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; max-height: 420px; overflow: auto; }
.nspan { background: color-mix(in srgb, var(--s4) 22%, transparent); border-radius: 3px; cursor: pointer; }
.nspan:hover { background: color-mix(in srgb, var(--s4) 50%, transparent); }
.nspan sup { font-size: 9.5px; color: var(--ink-2); margin-left: 1px; }
.just { font-size: 12px; color: var(--ink-2); }
.claim { border-bottom: 1px solid var(--grid); padding: 5px 0; font-size: 13px; overflow-wrap: anywhere; }
.claim .gr { font-size: 12px; color: var(--ink-2); margin: 2px 0 0 14px; }
.claim .gr q { font-style: italic; }
.chunk { border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; margin: 5px 0; background: var(--surface); }
.chunk.gold { box-shadow: inset 3px 0 0 var(--lab-S); }
.chunk.part { box-shadow: inset 3px 0 0 var(--lab-P); }
.chunk.focus { outline: 2px solid var(--accent); }
.chunk .meta { font-size: 11.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; overflow-wrap: anywhere; }
.chunk .path { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.chunk .txt { font-size: 12.5px; white-space: pre-wrap; margin-top: 4px; overflow-wrap: anywhere; cursor: pointer; }
.chunk .txt.cut { max-height: 4.6em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.tokbar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--ring); margin: 6px 0; }
.tokbar > div { height: 100%; border-right: 1px solid var(--surface); }
.prompt { border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; font-size: 12.5px; }
.prompt .part { padding: 8px 12px; white-space: pre-wrap; border-top: 1px solid var(--ring); overflow-wrap: anywhere; }
.prompt .part:first-child { border-top: 0; }
.prompt .plabel { display: block; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; white-space: normal; }
.prompt .sys { background: var(--surface-2); color: var(--ink-2); }
.prompt .slotq { background: color-mix(in srgb, var(--s4) 22%, transparent); border-radius: 3px; padding: 0 2px; }
.prompt .slotc { border-left: 3px solid var(--s1); margin: 4px 0; padding: 2px 8px; background: color-mix(in srgb, var(--s1) 6%, transparent); }
.prompt .slotc.gold { border-left-color: var(--lab-S); background: color-mix(in srgb, var(--lab-S) 8%, transparent); }
.prompt .slotc .dh { font-weight: 650; }
.heat { font-variant-numeric: tabular-nums; text-align: right; }
/* collapsible sections */
details.sec { border: 1px solid var(--ring); border-radius: 10px; background: var(--surface); margin: 8px 0; }
details.sec > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 8px; align-items: baseline; border-radius: 10px; }
details.sec > summary .sh { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary:hover { background: var(--surface-2); }
details.sec > summary .chev { display: inline-block; width: 12px; color: var(--muted); transition: transform .12s; flex: none; }
details.sec > summary .chev::before { content: "▸"; }
details.sec[open] > summary .chev { transform: rotate(90deg); }
details.sec > summary .st { font-weight: 650; overflow-wrap: anywhere; }
details.sec > summary .st .plain { font-weight: 400; }
details.sec > summary .ss { color: var(--ink-2); font-size: 12px; display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
details.sec > .sb { padding: 2px 14px 12px 32px; }
details.sec.l1 > summary .st { font-size: 15px; }
details.sec.l2 { background: var(--page); border-radius: 8px; margin: 6px 0; }
details.sec.l2 > summary { padding: 5px 10px; }
details.sec.l2 > summary .st { font-weight: 600; font-size: 13px; }
details.sec.l2 > .sb { padding: 2px 10px 10px 26px; }
details.sec.l3 { background: var(--surface); border-radius: 6px; margin: 4px 0; }
details.sec.l3 > summary { padding: 3px 8px; }
details.sec.l3 > summary .st { font-weight: 600; font-size: 12.5px; }
details.sec.l3 > .sb { padding: 0 8px 8px 22px; }
details.sec, .chunk { scroll-margin-top: 64px; }
details.sec.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: none; } }
.pagehead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.pagehead .grow { flex: 1; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 3px 10px; font-size: 12px; color: var(--ink-2); }
.stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
.legend { font-size: 12px; color: var(--ink-2); margin: 4px 0; }
@media (max-width: 640px) {
  details.sec > .sb { padding-left: 12px; padding-right: 8px; }
  details.sec.l2 > .sb, details.sec.l3 > .sb { padding-left: 8px; }
  .top-inner h1 { font-size: 14px; }
}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <h1>BR-TaxQA-R Explorer</h1>
  <nav class="main"><a href="#/q" id="navQ">Questions</a><a href="#/d" id="navD">Corpus</a></nav>
  <button class="btn" id="backBtn" title="Back (browser history)">◀ Back</button>
  <div class="trail" id="trail"></div>
  <a class="small" href="../dashboard/index.html" title="the previous results dashboard (kept for reference)">results dashboard ↗</a>
</div></header>
<main id="main"></main>

<script src="../dashboard/data/trace/index.js" onerror="window.TRACE_MISSING=true"></script>
<script src="data/index.js" onerror="window.EXP_MISSING=true"></script>
<script>
"use strict";
// =====================================================================================================
// helpers (copied from docs/dashboard/index.html, which stays unchanged)
// =====================================================================================================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== "") e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const fmt = (v, d = 3) => v == null || Number.isNaN(v) ? "—" : (+v).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const short = (s, n = 70) => s && s.length > n ? s.slice(0, n - 1) + "…" : (s || "");
function chips(container, options, state, key, { onchange, colors } = {}) {
  container.innerHTML = "";
  for (const o of options) {
    const val = typeof o === "object" ? o.value : o, lab = typeof o === "object" ? o.label : o;
    const b = h("button", { class: "chip", "aria-pressed": String(state[key] === val), type: "button" });
    if (colors && colors[val]) b.append(h("span", { class: "sw", style: `background:${colors[val]}` }));
    b.append(lab);
    b.onclick = () => { state[key] = val; chips(container, options, state, key, { onchange, colors }); onchange && onchange(); };
    container.append(b);
  }
  return container;
}
const ctl = (label, el) => h("div", { class: "ctl" }, label, el);
const SCOL = { S1: "--s1", S2: "--s2", S3: "--s3", S2c: "--s4", S4: "--s5" };
const scol = s => css(SCOL[s] || "--muted");
const EMBS = ["jua-4b-mixed", "gemini-emb-2"];
const EMB_SHORT = { "jua-4b-mixed": "jua", "gemini-emb-2": "Gemini" };
const LLMS = ["gpt-6.2-sol", "gpt-5.6-terra", "gpt-5.6-luna", "sabia-4", "sabiazinho-4"];
const LLM_SHORT = { "gpt-6.2-sol": "Sol (6.2)", "gpt-5.6-terra": "Terra", "gpt-5.6-luna": "Luna", "sabia-4": "Sabiá-4", "sabiazinho-4": "Sabiazinho-4" };
const ctxLabel = cid => {
  if (!cid) return "";
  const [c, emb] = cid.split("@");
  let s = c.replace("_budget", " ").replace("closed_book", "closed book").replace("wrong-S2", "wrong ctx S2").replace("_context_v1", " (template v1)");
  s = s.replace(/(\d+)000( |$)/, "$1k$2");
  return s + (emb ? " · Gemini" : (c.match(/^S\d|^S2c/) ? " · jua" : ""));
};
const IMP_HELP = "vital: a correct answer to this question must contain this fact (test C4: without it the answer would be wrong or misleading). " +
  "okay: useful but not essential. Assigned by the nugget creator (GPT-6.1 Sol, prompt create_v4); no person labelled them. " +
  "V and V_strict count vital nuggets only; W weights vital 1, okay 0.5.";
const LAB_NAME = { S: "support", P: "partial_support", N: "not_support", C: "contradicts", "-": "not labelled" };
const labCell = (L, title) => h("span", { class: "labcell " + (L && L !== "-" ? L : "X"), text: L || "–", title: (LAB_NAME[L] || "") + (title ? ": " + title : "") });
const impBadge = n => h("span", { class: "imp-badge " + n.imp, text: n.imp, title: IMP_HELP });
let HEAT = null;
const heatBg = (v, max = 1) => v == null ? "" : `background: rgba(${HEAT || (HEAT = css("--heat"))}, ${(0.08 + 0.55 * Math.max(0, Math.min(1, v / max))).toFixed(3)})`;
const heatTd = (v, d = 2, title) => h("td", { class: "heat", style: heatBg(v), text: fmt(v, d), title });

// =====================================================================================================
// data
// =====================================================================================================
const TI = window.TRACE_INDEX || null;
const EI = window.EXP_INDEX || null;
window.TRACE_Q = window.TRACE_Q || {}; window.TRACE_DOC = window.TRACE_DOC || {}; window.EXP_Q = window.EXP_Q || {};
const STRATS = TI ? TI.strategies : ["S1", "S2", "S3", "S2c", "S4"];
const SCOLORS = () => Object.fromEntries(STRATS.map(s => [s, scol(s)]));
const BUDGETS = TI ? TI.budgets : [1000, 2000, 4000, 8000, 16000];
const LEVELS = ["document", "article", "provision"];
const scripts = {};
function need(src) {
  if (!scripts[src]) scripts[src] = new Promise((ok, fail) => {
    const s = document.createElement("script"); s.src = src;
    s.onload = ok; s.onerror = () => { delete scripts[src]; fail(new Error(src)); };
    document.body.append(s);
  });
  return scripts[src];
}
const TRACE = "../dashboard/data/trace/";
const loadQ = q => Promise.all([need(`${TRACE}q/${q}.js`), need(`data/q/${q}.js`)]).then(() => [window.TRACE_Q[q], window.EXP_Q[q]]);
const docFile = d => TI.documents[d]?.[2];
const DOCIDX = {};
function loadDoc(d) {
  if (!docFile(d)) return Promise.reject(new Error(`${d} is not in the corpus`));
  return need(`${TRACE}doc/${docFile(d)}.js`).then(() => {
    const D = window.TRACE_DOC[d];
    if (!DOCIDX[d]) DOCIDX[d] = new Map(D.chunks.map(c => [c[0], c]));
    return D;
  });
}
const docTitle = d => (EI?.documents[d]?.title || TI?.documents[d]?.[0] || d || "").replace(/ — Receita Federal( do Brasil)?/, "");

  const draw = () => {
    box.innerHTML = "";
    const rows = D.chunks.filter(c => c[12] & TI.strategy_bit[dState.strat]);
    box.append(h("p", { class: "small", text: `${dState.strat}: ${rows.length} chunks${rows.length > dState.rows ? ` (first ${dState.rows})` : ""}. Green edge: chunk of an article cited by a question.` }));
    for (const c of rows.slice(0, dState.rows)) box.append(chunkCard(c, D, { link: false, cls: c[4] && model.cites.has(c[4]) && !D.files.find(f => f.arquivo === c[1])?.annex ? "gold" : "" }));
    if (rows.length > dState.rows) box.append(h("button", { class: "btn", text: `show ${Math.min(rows.length - dState.rows, 300)} more`, onclick: () => { dState.rows += 300; draw(); } }));
  };
  chips(sBox, STRATS, dState, "strat", { onchange: () => { dState.rows = 300; draw(); }, colors: SCOLORS() });
  draw();
}

// =====================================================================================================
// boot
// =====================================================================================================
route();
</script>
